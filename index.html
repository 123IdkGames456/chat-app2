<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11141c"><title>Chat App 2</title><style>
:root{color-scheme:dark;--bg:#11141c;--p:#191e29;--p2:#222938;--line:#30394b;--text:#f3f5fb;--muted:#9ba6ba;--a:#8178f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{color:inherit;background:var(--p2);border:1px solid var(--line);border-radius:11px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.45}input,textarea{background:#121722;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px;outline:0;min-width:0}input:focus,textarea:focus{border-color:var(--a)}.app{height:100dvh;max-width:1100px;margin:auto;padding:12px;display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:12px;padding:8px 2px 15px;border-bottom:1px solid var(--line)}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#a39cff,#5d54d7);display:grid;place-items:center;font-size:20px;font-weight:900}.brand{display:flex;align-items:center;gap:10px}.brand b{display:block;font-size:16px}.status{font-size:12px;color:var(--muted);margin-top:3px}.actions{margin-left:auto;display:flex;gap:7px}.primary{background:var(--a);border-color:transparent;font-weight:750}.profile{display:flex;gap:8px;padding:12px 0}.profile input{flex:1}.profile #room{max-width:155px}.head{display:flex;justify-content:space-between;padding:12px 3px;border-bottom:1px solid var(--line)}.head small{color:var(--muted)}#messages{flex:1;min-height:0;overflow:auto;padding:20px 3px}.msg{display:flex;gap:10px;max-width:820px;margin:0 auto 17px}.msg.mine{flex-direction:row-reverse}.avatar{width:38px;height:38px;flex:none;border-radius:13px;background:#37365f;display:grid;place-items:center;font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.wrap{max-width:80%;min-width:0}.mine .wrap{display:flex;flex-direction:column;align-items:flex-end}.name{font-size:12px;color:#b9bfd0;margin:2px 0 6px}.bubble{background:var(--p);border:1px solid var(--line);border-radius:15px 15px 15px 4px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.mine .bubble{background:#393765;border-color:#5b5997;border-radius:15px 15px 4px 15px}.pic{display:block;max-width:260px;max-height:260px;object-fit:contain;border-radius:10px;margin-top:8px}.empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center}.composer{display:flex;gap:7px;padding-top:12px;border-top:1px solid var(--line)}.composer textarea{flex:1;height:48px;resize:none;line-height:24px}.foot{font-size:11px;color:var(--muted);padding:8px 2px;min-height:26px}.file{display:none}.modal{position:fixed;inset:0;background:#05070be8;display:grid;place-items:center;padding:15px}.modal.hide{display:none}.card{width:min(560px,100%);background:var(--p);border:1px solid var(--line);border-radius:18px;padding:20px}.card p{color:var(--muted);font-size:13px;line-height:1.5}.card label{display:block;margin:12px 0 6px;color:var(--muted);font-size:12px}.card input{width:100%}.tools{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}@media(max-width:560px){.app{padding:8px}.top{gap:7px}.logo{width:36px;height:36px}.brand b{font-size:14px}.actions button{padding:9px;font-size:12px}.profile{gap:6px}.profile #room{max-width:105px}.profile input{padding:9px}.wrap{max-width:86%}.composer{gap:5px}.composer button{padding:9px}.pic{max-width:220px}.tools{grid-template-columns:1fr}}
</style></head><body><main class="app"><header class="top"><div class="brand"><div class="logo">✦</div><div><b>Chat App 2</b><div id="status" class="status">Disconnected · set server URL</div></div></div><div class="actions"><button id="settingsBtn">Settings</button><button id="connect" class="primary">Connect</button></div></header><div class="profile"><input id="name" maxlength="32" placeholder="Display name"><input id="room" maxlength="40" placeholder="general"><button id="save">Save</button></div><div class="head"><b id="roomTitle"># general</b><small id="count">Google Sheets chat</small></div><section id="messages"><div class="empty">Set the Apps Script URL in Settings to connect.</div></section><form id="form" class="composer"><input id="file" class="file" type="file" accept="image/*"><button id="attach" type="button">＋ Image</button><textarea id="text" maxlength="1500" placeholder="Write a message…" disabled></textarea><button id="send" class="primary" disabled>Send</button></form><div id="feedback" class="foot">Messages are saved to your Google Sheet.</div></main><div id="modal" class="modal hide"><div class="card"><h2>Chat settings</h2><p>Paste your deployed Google Apps Script Web App URL ending in /exec. The app uses your Google Sheet as its message database.</p><label>Apps Script Web App URL</label><input id="url" placeholder="https://script.google.com/macros/s/.../exec"><div class="tools"><button id="test">Test connection</button><button id="theme">Change accent</button><button id="clear">Clear chat view</button><button id="close" class="primary">Save & close</button></div></div></div>
<script>(()=>{const $=x=>document.getElementById(x),key="chat2_sheets_api";let api=localStorage.getItem(key)||"",cursor=0,busy=false,live=false,timer=null,pending="",device=localStorage.getItem("chat2_device")||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now())),avatar=localStorage.getItem("chat2_avatar")||"";localStorage.setItem("chat2_device",device);$("url").value=api;$("name").value=localStorage.getItem("chat2_name")||"";$("room").value=localStorage.getItem("chat2_room")||"general";
function say(s){$("feedback").textContent=s}function status(ok){live=ok;$("status").textContent=ok?"Connected · Google Sheets":"Disconnected";$("status").style.color=ok?"#78dfa3":"var(--muted)";$("text").disabled=!ok;$("send").disabled=!ok}
function jsonp(q){return new Promise((res,rej)=>{let cb="cb_"+Math.random().toString(36).slice(2),s=document.createElement("script"),tm=setTimeout(()=>{clean();rej(Error("Timed out"))},12000);function clean(){clearTimeout(tm);delete window[cb];s.remove()}window[cb]=d=>{clean();res(d)};q.callback=cb;s.src=api+"?"+new URLSearchParams(q);s.onerror=()=>{clean();rej(Error("Apps Script unavailable"))};document.head.append(s)})}
function render(m){let empty=$("messages").querySelector(".empty");if(empty)empty.remove();let el=document.createElement("article");el.className="msg"+(m.device===device?" mine":"");let av=document.createElement("div");av.className="avatar";if(m.avatar){let im=new Image();im.src=m.avatar;av.append(im)}else av.textContent=(m.name||"?")[0].toUpperCase();let w=document.createElement("div");w.className="wrap";let n=document.createElement("div");n.className="name";n.textContent=m.name||"Guest";let b=document.createElement("div");b.className="bubble";b.textContent=m.text||"";if(m.image){let im=new Image();im.className="pic";im.src=m.image;im.alt="Image";b.append(im)}w.append(n,b);el.append(av,w);$("messages").append(el);$("messages").scrollTop=$("messages").scrollHeight}
async function poll(){if(!api||busy)return;busy=true;try{let d=await jsonp({action:"poll",room:$("room").value.trim()||"general",after:cursor});if(!d.ok)throw Error(d.error||"Server error");(d.messages||[]).forEach(render);cursor=Math.max(cursor,Number(d.cursor)||0);status(true);$("count").textContent="Synced · "+(d.messages||[]).length+" new";say("Live · data stored in Google Sheets")}catch(e){status(false);say("Connection failed: "+e.message)}finally{busy=false}}
async function connect(){api=$("url").value.trim();localStorage.setItem(key,api);if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(api)){say("Enter a valid Apps Script /exec URL.");return}cursor=0;$("messages").innerHTML='<div class="empty">Connecting…</div>';try{let d=await jsonp({action:"poll",room:$("room").value.trim()||"general",after:0});if(!d.ok)throw Error(d.error||"Server not ready");(d.messages||[]).forEach(render);cursor=Number(d.cursor)||0;status(true);say("Connected to your sheet");if(timer)clearInterval(timer);timer=setInterval(poll,1800)}catch(e){status(false);say("Could not connect: "+e.message)}}
async function compress(f){if(!f.type.startsWith("image/"))throw Error("Select an image file");let u=URL.createObjectURL(f);try{return await new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>{let sc=Math.min(1,300/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",.65))};im.onerror=()=>reject(Error("Image load failed"));im.src=u})}finally{URL.revokeObjectURL(u)}}
async function send(){let n=$("name").value.trim(),r=$("room").value.trim()||"general",txt=$("text").value.trim();if(!n){say("Choose a display name.");return}if(!txt&&!pending)return;if(!api){say("Set the Apps Script URL in Settings.");return}$("send").disabled=true;try{let body=new URLSearchParams({name:n,room:r,device,text:txt,image:pending,avatar});await fetch(api,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body});$("text").value="";pending="";say("Sent · waiting for sheet sync");setTimeout(poll,800)}catch(e){say("Send failed: "+e.message)}finally{$("send").disabled=!live}}
$("form").onsubmit=e=>{e.preventDefault();send()};$("text").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};$("attach").onclick=()=>$("file").click();$("file").onchange=async e=>{let f=e.target.files[0];if(!f)return;try{pending=await compress(f);say("Image attached · press Send")}catch(x){say(x.message)}e.target.value=""};
$("connect").onclick=connect;$("test").onclick=connect;$("settingsBtn").onclick=()=>$("modal").classList.remove("hide");$("close").onclick=()=>{$("modal").classList.add("hide");connect()};$("save").onclick=()=>{localStorage.setItem("chat2_name",$("name").value.trim());localStorage.setItem("chat2_room",$("room").value.trim()||"general");$("roomTitle").textContent="# "+($("room").value.trim()||"general");cursor=0;$("messages").innerHTML="";poll()};$("clear").onclick=()=>{$("messages").innerHTML='<div class="empty">Chat view cleared.</div>';cursor=0};$("theme").onclick=()=>document.documentElement.style.setProperty("--a",getComputedStyle(document.documentElement).getPropertyValue("--a").trim()==="#8178f8"?"#4bc6a3":"#8178f8");if(api)connect();window.onbeforeunload=()=>timer&&clearInterval(timer)})();</script></body></html>
